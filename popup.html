<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    input, button { width: 100%; margin-top: 10px; padding: 8px; box-sizing: border-box; }
    button { background-color: #4285f4; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #357abd; }
  </style>
</head>
<body>
  <h3>PDF Extractor</h3>
  <label>Select PDFs:</label>
  <input type="file" id="pdfFiles" accept="application/pdf" multiple>
  
  <label>Page Number (1-indexed):</label>
  <input type="number" id="pageNumber" value="1" min="1">
  
  <button id="extractBtn">Extract & Download</button>
  
  <!-- We use a CDN for the PDF library for simplicity -->
  <script src="pdf-lib.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
